
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: petsitter
      POSTGRES_USER: petsitter
      POSTGRES_PASSWORD: petsitter
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  web:
    build: .
    command: gunicorn petsitter.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/staticfiles

    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:1.25
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/code/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: